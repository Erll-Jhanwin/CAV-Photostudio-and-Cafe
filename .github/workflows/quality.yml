name: Quality and security gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'false'
      DJANGO_SECRET_KEY: ci-ci-ci-random-placeholder-key-for-checks-9f5d7a2c1e8b4d6a
      DATABASE_URL: sqlite:///ci.sqlite3
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      AUTH_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py test audit booking chatbot dashboard forecasting gallery inventory notifications pos reports sales users --noinput
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r apps config -x "*/tests.py,*/test_*.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace frontend
      - run: npm --workspace frontend test -- --watchAll=false --runInBand
      - run: npm --workspace frontend run build
      - run: npm audit --workspace frontend --audit-level=high
      - run: npx --yes serve -s frontend/build -l 4173 > frontend-server.log 2>&1 &
      - run: npx --yes @axe-core/cli http://127.0.0.1:4173 --exit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/secret_scan.py
