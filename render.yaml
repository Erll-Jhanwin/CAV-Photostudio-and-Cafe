services:
  - type: web
    name: cav-photostudio-and-cafe-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/build
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REACT_APP_API_BASE_URL
        value: https://cav-photostudio-and-cafe.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 22100729214-a9qrjd5vlvad0crt754f236968rrb3m8.apps.googleusercontent.com
      - key: REACT_APP_RECAPTCHA_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; connect-src 'self' https://cav-photostudio-and-cafe.onrender.com https://www.google.com/recaptcha/ http://localhost:* http://127.0.0.1:* capacitor://localhost; frame-src https://accounts.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
